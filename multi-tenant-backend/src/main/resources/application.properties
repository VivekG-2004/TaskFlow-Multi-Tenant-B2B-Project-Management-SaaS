# ─── Application ───────────────────────────────────────────
spring.application.name=taskflow-backend

# ─── Master DataSource ─────────────────────────────────────
spring.datasource.master.jdbc-url=jdbc:mysql://localhost:3306/taskflow_master?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.master.username=root
spring.datasource.master.password=Vigkul2004*
spring.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.tenant.username=root
spring.datasource.tenant.password=Vigkul2004*

# ─── JPA ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Flyway (master schema only — auto on startup) ─────────
spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://localhost:3306/taskflow_master?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.flyway.user=root
spring.flyway.password=Vigkul2004*
spring.flyway.schemas=taskflow_master
spring.flyway.locations=classpath:db/master/migration
spring.flyway.baseline-on-migrate=true

# ─── JWT ───────────────────────────────────────────────────
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.jwt.super-admin-secret=7A25432A462D4A614E645267556B58703273357638792F423F4528482B4D6251

# ─── Server ────────────────────────────────────────────────
server.port=8080

# ─── Logging ───────────────────────────────────────────────
logging.level.com.taskflow=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=DEBUG

logging.level.org.springframework.web=DEBUG
logging.level.com.vivek=DEBUG

# ─── Connection Pool ────────────────────────────────────────
spring.datasource.master.hikari.minimum-idle=1
spring.datasource.master.hikari.maximum-pool-size=5
spring.datasource.master.hikari.idle-timeout=300000
spring.datasource.master.hikari.connection-timeout=20000
spring.datasource.master.hikari.keepalive-time=60000
spring.datasource.master.hikari.max-lifetime=600000
spring.datasource.master.hikari.connection-test-query=SELECT 1