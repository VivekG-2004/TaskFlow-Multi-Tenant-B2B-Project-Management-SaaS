# ─── Application ───────────────────────────────────────────
spring.application.name=taskflow-backend

# ─── Master DataSource ─────────────────────────────────────
spring.datasource.master.jdbc-url=${MASTER_DB_URL}
spring.datasource.master.username=${DB_USERNAME}
spring.datasource.master.password=${DB_PASSWORD}
spring.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.tenant.username=${DB_USERNAME}
spring.datasource.tenant.password=${DB_PASSWORD}

# ─── JPA ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Flyway ────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.url=${MASTER_DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.schemas=taskflow_master
spring.flyway.locations=classpath:db/master/migration
spring.flyway.baseline-on-migrate=true

# ─── JWT ───────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.super-admin-secret=${SUPER_ADMIN_JWT_SECRET}

# ─── Server ────────────────────────────────────────────────
server.port=8080

# ─── Logging ───────────────────────────────────────────────
logging.level.com.vivek=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=INFO